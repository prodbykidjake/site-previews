  SiteLeads demo template — one file, every niche.

  Fastest way to make a demo for a lead: no editing, just a link with URL params:
    index.html?niche=pdr&name=Ace%20Dent%20Pros&phone=6145550123&city=Columbus&rating=4.9&reviews=87

<style>
:root{
  --bg:#f7f7f5; --surface:#ffffff; --ink:#16181d; --muted:#5d6370; --line:#e4e4e0;
  --hero:#121418; --hero-ink:#f4f4f2; --accent:#e8590c; --accent-ink:#fff;
  --radius:14px; --shadow:0 1px 2px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.06);
}
*{box-sizing:border-box;margin:0}
body{font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:76px}
a{color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
.banner{background:#fff4d6;color:#5a4300;font-size:13px;text-align:center;padding:8px 16px;border-bottom:1px solid #f0dfa8}
.switcher{background:#1d2027;color:#cfd3dc;font-size:13px;padding:8px 16px;display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
.switcher select{font:inherit;padding:4px 8px;border-radius:8px;border:0}
header.top{position:sticky;top:0;z-index:5;background:rgba(18,20,24,.92);backdrop-filter:blur(8px);color:var(--hero-ink)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;height:60px;gap:12px}
.logo{font-weight:800;letter-spacing:-.02em;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo span{color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;border-radius:999px;padding:12px 22px;text-decoration:none;border:0;cursor:pointer;font-size:16px}
.btn-accent{background:var(--accent);color:var(--accent-ink)}
.btn-ghost{background:rgba(255,255,255,.1);color:var(--hero-ink)}
.btn-sm{padding:8px 16px;font-size:14px}
.hero{background:var(--hero);color:var(--hero-ink);padding:64px 0 72px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-120px;top:-120px;width:420px;height:420px;border-radius:50%;background:var(--accent);opacity:.18;filter:blur(40px)}
.hero .eyebrow{display:inline-flex;gap:8px;align-items:center;font-size:14px;color:#c9ccd3;background:rgba(255,255,255,.08);padding:6px 12px;border-radius:999px}
.stars{color:#ffc53d;letter-spacing:1px}
.hero h1{font-size:clamp(32px,6vw,54px);line-height:1.08;letter-spacing:-.03em;margin:18px 0 14px;max-width:780px}
.hero p.lead{font-size:clamp(17px,2.2vw,20px);color:#c9ccd3;max-width:620px}
.hero .ctas{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.trust{display:flex;gap:22px;flex-wrap:wrap;margin-top:34px;font-size:14px;color:#aeb3bd}
.trust b{color:var(--hero-ink)}
section{padding:64px 0}
h2{font-size:clamp(26px,4vw,36px);letter-spacing:-.02em;line-height:1.15;margin-bottom:10px}
.sub{color:var(--muted);max-width:620px;margin-bottom:32px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow)}
.card .ic{width:40px;height:40px;border-radius:10px;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent);display:grid;place-items:center;font-weight:800;margin-bottom:14px}
.card h3{font-size:18px;margin-bottom:6px}
.card p{color:var(--muted);font-size:15px}
.feature{background:var(--surface);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.feature .wrap{display:grid;gap:40px;grid-template-columns:1fr 1.1fr;align-items:start}
.checks{list-style:none;padding:0;display:grid;gap:10px;margin-top:18px}
.checks li{padding-left:30px;position:relative}
.checks li:before{content:"✓";position:absolute;left:0;top:0;width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;display:grid;place-items:center;font-weight:800}
form.req{background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);padding:22px;display:grid;gap:14px}
form.req .tag{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--accent)}
label{display:grid;gap:6px;font-size:14px;font-weight:600}
input,select,textarea{font:inherit;padding:11px 12px;border-radius:10px;border:1px solid #d3d3ce;background:#fff;width:100%}
textarea{min-height:90px;resize:vertical}
.row2{display:grid;gap:14px;grid-template-columns:1fr 1fr}
.pkgs{display:grid;gap:10px}
.pkg{display:flex;gap:12px;align-items:flex-start;border:1px solid #d3d3ce;border-radius:10px;padding:12px;background:#fff;cursor:pointer;font-weight:500}
.pkg input{width:auto;margin-top:4px}
.pkg b{display:block}
.pkg small{color:var(--muted)}
.drop{border:2px dashed #c9c9c3;border-radius:10px;padding:18px;text-align:center;color:var(--muted);font-weight:500;background:#fff}
.note{font-size:13px;color:var(--muted)}
.ok{display:none;background:#e6f6ea;color:#1c5d2c;border-radius:10px;padding:12px;font-size:14px}
.reviews .card p{color:var(--ink)}
.reviews .who{margin-top:12px;font-size:14px;color:var(--muted)}
.ph{border-style:dashed;box-shadow:none;background:transparent}
.area{display:flex;flex-wrap:wrap;gap:8px}
.area span{background:var(--surface);border:1px solid var(--line);padding:8px 14px;border-radius:999px;font-size:15px}
.steps{counter-reset:s}
.steps .card h3:before{counter-increment:s;content:counter(s);display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--ink);color:#fff;font-size:14px;margin-right:10px}
.cta-band{background:var(--hero);color:var(--hero-ink);text-align:center}
.cta-band p{color:#c9ccd3;margin:6px 0 24px}
footer{padding:28px 0;color:var(--muted);font-size:14px;text-align:center}
.callbar{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:rgba(255,255,255,.95);backdrop-filter:blur(8px);border-top:1px solid var(--line);display:flex;gap:10px}
.callbar .btn{flex:1}
@media (min-width:860px){.callbar{display:none} body{padding-bottom:0}}
@media (max-width:860px){.feature .wrap{grid-template-columns:1fr}.hide-sm{display:none}}
@media (max-width:480px){.row2{grid-template-columns:1fr}.hero{padding:44px 0 52px}}
</style>

const q = new URLSearchParams(location.search);

const S = {...SITE};

for (const k of ["name","phone","city","owner","years","rating"]) if (q.get(k)) S[k] = q.get(k);
if (q.get("reviews")) S.reviewCount = +q.get("reviews");
if (q.get("areas")) S.areas = q.get("areas").split(",").map(s=>s.trim()).filter(Boolean);

document.documentElement.style.setProperty("--accent", N.accent);
document.title = `${name} | ${N.label} in ${city}`;

}
