<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Website preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wdth,wght@75..100,400..700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@300..800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=TikTok+Sans:wght@300..700&display=swap">
<style>
/* ---------- theme tokens ---------- */
:root{
  --bg:#0c0c0b;--bg2:#141413;--ink:#f1f0ec;--muted:#8f8e89;--line:#262624;--card:#171716;
  --accent:#ff5b1f;--on-accent:#0c0c0b;--hl:#ff6a33;--deep:#ff5b1f;--on-deep:#0c0c0b;
  --display:"Instrument Sans",system-ui,sans-serif;--body:"Instrument Sans",system-ui,sans-serif;--mono:"Geist Mono",ui-monospace,Menlo,monospace;
  --dvar:"wdth" 75;--dwt:600;--track:-.03em;--case:uppercase;--r:6px;--rb:4px;
  --ease:cubic-bezier(.2,.75,.1,1);--wrap:1320px;--gut:clamp(16px,4vw,48px);
}
[data-theme=dent]{
  --bg:#0f0f0f;--bg2:#181a18;--ink:#ededed;--muted:#a3a8a2;--line:#2a2d2a;--card:#1d1f1d;
  --accent:#d9e2cc;--on-accent:#0f0f0f;--hl:#c8d6b4;--deep:#2f382f;--on-deep:#ededed;
  --display:"TikTok Sans","Instrument Sans",sans-serif;--dvar:normal;--dwt:300;--track:-.05em;--case:none;--r:20px;--rb:999px;
}
[data-theme=trade]{
  --bg:#f2f2f2;--bg2:#ffffff;--ink:#0e0e0e;--muted:#5c5c5c;--line:#d5d5d5;--card:#ffffff;
  --accent:#ff5b1f;--on-accent:#ffffff;--hl:#d94612;--deep:#0e0e0e;--on-deep:#f2f2f2;
  --body:"Geist",system-ui,sans-serif;--dvar:"wdth" 88;--dwt:500;--track:-.035em;--case:none;--r:18px;--rb:999px;
}
[data-theme=field]{
  --bg:#fbfcf8;--bg2:#e7ece3;--ink:#141713;--muted:#525a50;--line:#d3dacf;--card:#ffffff;
  --accent:#eef48b;--on-accent:#141713;--hl:#1f3d2c;--deep:#1f3d2c;--on-deep:#eef2e8;
  --display:"Host Grotesk",system-ui,sans-serif;--body:"Host Grotesk",system-ui,sans-serif;--dvar:normal;--dwt:500;--track:-.03em;--case:none;--r:24px;--rb:999px;
}
/* ---------- base ---------- */
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:400 17px/1.55 var(--body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 var(--gut)}
.disp{font-family:var(--display);font-variation-settings:var(--dvar);font-weight:var(--dwt);letter-spacing:var(--track);line-height:.95}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.kicker{display:inline-flex;align-items:center;gap:10px;color:var(--muted)}
.kicker::before{content:"";width:22px;height:1px;background:currentColor}
::selection{background:var(--accent);color:var(--on-accent)}

/* buttons */
.btn{--h:52px;position:relative;display:inline-flex;align-items:center;justify-content:center;gap:10px;height:var(--h);padding:0 26px;border-radius:var(--rb);font-weight:600;font-size:15px;border:1px solid transparent;cursor:pointer;overflow:hidden;isolation:isolate;transition:color .4s var(--ease),border-color .4s,transform .4s var(--ease);white-space:nowrap}
.btn::after{content:"";position:absolute;inset:0;z-index:-1;transform:translateY(101%);transition:transform .5s var(--ease)}
.btn:hover::after{transform:none}
.btn .ar{transition:transform .4s var(--ease)}.btn:hover .ar{transform:translateX(4px)}
.btn-a{background:var(--accent);color:var(--on-accent)}.btn-a::after{background:var(--ink)}.btn-a:hover{color:var(--bg)}
.btn-o{border-color:currentColor}.btn-o::after{background:var(--ink)}.btn-o:hover{color:var(--bg);border-color:var(--ink)}
.on-photo .btn-o{color:#fff}.on-photo .btn-o::after{background:#fff}.on-photo .btn-o:hover{color:#111;border-color:#fff}
.btn-sm{--h:40px;padding:0 18px;font-size:14px}

/* preview banner + progress */
.pv{position:relative;z-index:60;background:var(--ink);color:var(--bg);font:500 12px/1.4 var(--body);text-align:center;padding:8px 16px}
.pv b{font-weight:700}
.prog{position:fixed;top:0;left:0;height:2px;width:100%;background:var(--accent);transform-origin:0 50%;transform:scaleX(0);z-index:80}

/* header */
.hd{position:sticky;top:0;z-index:50;transition:background .4s,backdrop-filter .4s,border-color .4s;border-bottom:1px solid transparent}
.hd .wrap{display:flex;align-items:center;justify-content:space-between;height:72px;gap:20px}
.hd.solid{background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);border-color:var(--line)}
.logo{font-family:var(--display);font-variation-settings:var(--dvar);font-weight:600;font-size:19px;letter-spacing:-.02em;line-height:1.05;max-width:46vw}
[data-theme=garage] .logo{text-transform:uppercase;letter-spacing:.02em}
.logo small{display:block;font:500 11px/1.2 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.nav{display:flex;gap:28px;font-size:14px;font-weight:500}
.nav a{position:relative;opacity:.8;transition:opacity .3s}.nav a:hover{opacity:1}
.nav a::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:1px;background:currentColor;transform:scaleX(0);transform-origin:right;transition:transform .4s var(--ease)}
.nav a:hover::after{transform:scaleX(1);transform-origin:left}
@media (max-width:900px){.nav{display:none}}

/* ---------- hero: wordmark variant (dark) ---------- */
.hw-media{position:relative;height:min(84svh,900px);min-height:520px;overflow:hidden;margin:0 var(--gut);border-radius:var(--r)}
.hw-media img,.hc-media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.kb{animation:kb 22s ease-in-out infinite alternate;transform-origin:60% 40%}
@keyframes kb{from{transform:scale(1.04)}to{transform:scale(1.16) translate(-1.5%,1%)}}
.hw-media::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.45) 0%,rgba(0,0,0,0) 30%,rgba(0,0,0,.05) 55%,rgba(0,0,0,.72) 100%)}
.hw-chip{position:absolute;top:22px;left:22px;z-index:2;color:#fff}
.chip{display:inline-flex;align-items:center;gap:10px;padding:9px 14px 9px 12px;border-radius:999px;background:rgba(255,255,255,.14);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.22);font-size:13px;font-weight:500;color:#fff}
.chip .st{color:#ffc93c;letter-spacing:1px}
.hw-side{position:absolute;top:22px;right:22px;z-index:2;text-align:right;color:#fff}
.wm{position:absolute;left:0;right:0;bottom:-.06em;z-index:2;color:#fff;font-family:var(--display);font-variation-settings:var(--dvar);font-weight:var(--dwt);letter-spacing:var(--track);text-transform:var(--case);line-height:.8;white-space:nowrap;text-align:center;pointer-events:none}
[data-theme=garage] .wm{font-weight:700;letter-spacing:-.02em}
.wm span{display:inline-block}
.hw-intro{display:grid;grid-template-columns:1.25fr 1fr;gap:clamp(24px,5vw,80px);align-items:end;padding-top:clamp(36px,5vw,64px);padding-bottom:clamp(56px,7vw,110px)}
.hw-intro h1{font-size:clamp(42px,6.2vw,96px);text-transform:var(--case)}
.hw-intro .lead{font-size:clamp(17px,1.4vw,20px);color:var(--muted);max-width:46ch;margin-bottom:28px}
.ctas{display:flex;gap:12px;flex-wrap:wrap}
@media (max-width:860px){.hw-side{display:none}.hw-intro{grid-template-columns:1fr}.hw-media{height:62svh;min-height:420px}}

/* ---------- hero: card variant (light) ---------- */
.hc{position:relative;padding:0 var(--gut);max-width:calc(var(--wrap) + 2*var(--gut));margin:0 auto}
.hc-media{position:relative;height:min(86svh,880px);min-height:560px;border-radius:var(--r);overflow:hidden}
.hc-media::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.18),rgba(0,0,0,0) 50%)}
.hc-card{position:absolute;left:calc(var(--gut) + clamp(14px,2vw,28px));bottom:clamp(14px,2vw,28px);width:min(560px,calc(100% - 2*var(--gut) - 28px));background:var(--card);border-radius:calc(var(--r) - 6px);padding:clamp(24px,3vw,40px);z-index:2;box-shadow:0 30px 80px -30px rgba(0,0,0,.35)}
[data-theme=field] .hc-card{background:var(--accent)}
.hc-card h1{font-size:clamp(36px,4.4vw,64px);margin:16px 0 16px}
.hc-card .lead{color:var(--muted);margin-bottom:22px;max-width:44ch}
[data-theme=field] .hc-card .lead{color:#3c4430}
.ticks{list-style:none;display:grid;gap:6px;margin:0 0 24px;font-size:15px}
.ticks li{display:flex;gap:10px;align-items:center}.ticks li::before{content:"";width:16px;height:1px;background:currentColor}
.hc-badge{position:absolute;top:clamp(14px,2vw,28px);right:calc(var(--gut) + clamp(14px,2vw,28px));z-index:2}
.rate-k{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.rate-k .st{color:#f5a400;letter-spacing:1px}
[data-theme=field] .rate-k .st{color:#1f3d2c}
@media (max-width:860px){.hc-media{height:56svh;min-height:380px}.hc-card{position:relative;left:auto;bottom:auto;width:auto;margin:-70px 12px 0}}

/* split-word reveal */
.sw-line{display:inline}
.w{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.08em;margin-bottom:-.08em}
.w>span{display:inline-block;transform:translateY(105%);animation:wup 1s var(--ease) forwards;animation-delay:calc(1.1s + var(--i)*.06s)}
@keyframes wup{to{transform:none}}
.fade-in{opacity:0;animation:fin 1s var(--ease) 1.5s forwards}
@keyframes fin{to{opacity:1}}

/* ---------- marquee ---------- */
.mq{border-block:1px solid var(--line);overflow:hidden;white-space:nowrap;padding:22px 0;background:var(--bg)}
.mq-t{display:inline-flex;animation:mq 38s linear infinite}
.mq:hover .mq-t{animation-play-state:paused}
.mq-t span{font-family:var(--display);font-variation-settings:var(--dvar);font-weight:var(--dwt);letter-spacing:var(--track);text-transform:var(--case);font-size:clamp(26px,3.2vw,44px);padding-right:.6em;line-height:1}
.mq-t i{font-style:normal;color:var(--hl);padding-right:.6em;font-size:clamp(20px,2.4vw,32px);line-height:1.3}
@keyframes mq{to{transform:translateX(-50%)}}

/* ---------- sections ---------- */
section.s{padding:clamp(80px,10vw,150px) 0}
.s-head{display:flex;justify-content:space-between;align-items:end;gap:24px;margin-bottom:clamp(36px,5vw,64px);flex-wrap:wrap}
.s-head h2{font-size:clamp(38px,5.4vw,84px);max-width:13ch;text-transform:var(--case)}
.s-head p{color:var(--muted);max-width:40ch}
.alt{background:var(--bg2)}

/* statement + stats */
.stmt{font-family:var(--display);font-variation-settings:var(--dvar);font-weight:var(--dwt);letter-spacing:-.02em;font-size:clamp(28px,3.8vw,58px);line-height:1.1;max-width:22ch}
[data-theme=dent] .stmt{font-weight:300}
.stmt .sw{opacity:.16;transition:opacity .35s}
.stmt .sw.lit{opacity:1}
.stats{display:grid;grid-template-columns:repeat(4,1fr);margin-top:clamp(48px,6vw,90px);border-top:1px solid var(--line)}
.stat{padding:26px 22px 0 0;border-right:1px solid var(--line);margin-right:22px}
.stat:last-child{border-right:0}
.stat b{display:block;font-family:var(--display);font-variation-settings:var(--dvar);font-weight:var(--dwt);letter-spacing:var(--track);font-size:clamp(46px,5.6vw,88px);line-height:1}
.stat span{display:block;color:var(--muted);font-size:14px;margin-top:10px}
@media (max-width:760px){.stats{grid-template-columns:1fr 1fr}.stat:nth-child(2){border-right:0}.stat:nth-child(n+3){margin-top:10px}}

/* services */
.svc{display:grid;grid-template-columns:5fr 7fr;gap:clamp(28px,5vw,80px);align-items:start}
.svc.nophoto{grid-template-columns:1fr}
.svc-photo{position:sticky;top:100px;aspect-ratio:4/5;border-radius:var(--r);overflow:hidden;background:var(--bg2)}
.svc-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.08);transition:opacity .8s var(--ease),transform 1.4s var(--ease)}
.svc-photo img.on{opacity:1;transform:none}
.svc-photo .tagp{position:absolute;left:16px;bottom:16px;z-index:2}
.svc-list{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:64px 1fr auto;gap:18px;align-items:baseline;padding:clamp(22px,2.6vw,34px) 0;border-bottom:1px solid var(--line);cursor:default;transition:padding .5s var(--ease)}
.row .n{font:500 13px var(--mono);color:var(--muted)}
.row h3{font-family:var(--display);font-variation-settings:var(--dvar);font-weight:var(--dwt);letter-spacing:-.02em;font-size:clamp(26px,3vw,44px);line-height:1.02;text-transform:var(--case);transition:color .4s,transform .5s var(--ease)}
.row p{color:var(--muted);margin-top:8px;max-width:46ch;font-size:16px}
.row .ar2{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;transition:background .4s,border-color .4s,transform .5s var(--ease),color .4s}
.row.act h3,.row:hover h3{color:var(--hl);transform:translateX(6px)}
.row.act .ar2,.row:hover .ar2{background:var(--accent);border-color:var(--accent);color:var(--on-accent);transform:rotate(-45deg)}
@media (max-width:860px){.svc{grid-template-columns:1fr}.svc-photo{position:relative;top:0;aspect-ratio:16/11}.row{grid-template-columns:40px 1fr}.row .ar2{display:none}}

/* gallery */
.gal-wrap{position:relative}
.gal{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 var(--gut) 8px;scrollbar-width:none;cursor:grab}
.gal::-webkit-scrollbar{display:none}
.gal figure{flex:0 0 auto;height:clamp(300px,42vw,560px);aspect-ratio:var(--ar,4/5);border-radius:var(--r);overflow:hidden;scroll-snap-align:start;position:relative;background:var(--bg2);cursor:zoom-in}
.gal figure:nth-child(3n+2){--ar:5/4}.gal figure:nth-child(3n){--ar:3/4}
.gal img{width:100%;height:100%;object-fit:cover;transition:transform 1.2s var(--ease)}
.gal figure:hover img{transform:scale(1.06)}
.gal figure .num{position:absolute;top:12px;left:12px;color:#fff;background:rgba(0,0,0,.35);backdrop-filter:blur(6px);padding:5px 9px;border-radius:999px;font:500 11px var(--mono)}
.gal-ctl{display:flex;gap:10px}
.gal-ctl button{width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:transparent;cursor:pointer;font-size:18px;transition:background .3s,color .3s,border-color .3s}
.gal-ctl button:hover{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.credit{color:var(--muted);font-size:13px;margin-top:18px}
.lb{position:fixed;inset:0;z-index:100;background:rgba(8,8,8,.94);display:none;align-items:center;justify-content:center;padding:4vh 4vw}
.lb.open{display:flex;animation:fin .35s forwards}
.lb img{max-width:100%;max-height:88vh;border-radius:10px;object-fit:contain}
.lb button{position:absolute;background:rgba(255,255,255,.12);color:#fff;border:0;width:52px;height:52px;border-radius:50%;cursor:pointer;font-size:20px}
.lb .x{top:20px;right:20px}.lb .pr{left:20px;top:50%;transform:translateY(-50%)}.lb .nx{right:20px;top:50%;transform:translateY(-50%)}

/* request */
.req-s{background:var(--deep);color:var(--on-deep)}
[data-theme=garage] .req-s{background:var(--bg2);color:var(--ink)}
.req-g{display:grid;grid-template-columns:1fr 1fr;gap:clamp(32px,6vw,96px);align-items:start}
.req-g h2{font-size:clamp(38px,5vw,76px);text-transform:var(--case);margin:18px 0 22px}
.req-g .pitch{opacity:.75;max-width:42ch;font-size:18px}
.steps-mini{list-style:none;margin-top:34px;counter-reset:c}
.steps-mini li{counter-increment:c;display:flex;gap:16px;align-items:center;padding:16px 0;border-top:1px solid color-mix(in srgb,currentColor 18%,transparent)}
.steps-mini li::before{content:"0" counter(c);font:500 12px var(--mono);opacity:.6}
.callline{margin-top:30px;font-size:15px;opacity:.85}.callline a{border-bottom:1px solid currentColor;font-weight:600}
form.req{background:var(--card);color:var(--ink);border-radius:var(--r);padding:clamp(22px,3vw,36px);display:grid;gap:14px;box-shadow:0 40px 90px -40px rgba(0,0,0,.5)}
[data-theme=garage] form.req{border:1px solid var(--line)}
form.req .ft{font-family:var(--display);font-variation-settings:var(--dvar);font-weight:var(--dwt);font-size:26px;letter-spacing:-.02em;line-height:1.1;margin-bottom:6px}
form.req label{display:grid;gap:7px;font-size:13px;font-weight:600;color:var(--muted)}
form.req input,form.req select,form.req textarea{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:calc(var(--r)/2);padding:13px 14px;font-size:16px;font-weight:400;transition:border-color .3s,box-shadow .3s}
[data-theme=trade] form.req input,[data-theme=trade] form.req select,[data-theme=trade] form.req textarea,[data-theme=field] form.req input,[data-theme=field] form.req select,[data-theme=field] form.req textarea{background:var(--bg)}
form.req input:focus,form.req select:focus,form.req textarea:focus{outline:0;border-color:var(--hl);box-shadow:0 0 0 3px color-mix(in srgb,var(--hl) 22%,transparent)}
form.req textarea{min-height:92px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.drop{border:1.5px dashed var(--line);border-radius:calc(var(--r)/2);padding:24px;text-align:center;color:var(--muted);font-size:15px;cursor:pointer;transition:border-color .3s,background .3s}
.drop:hover{border-color:var(--hl);background:var(--bg)}
.pkgs{display:grid;gap:8px}.pkg{display:flex!important;gap:12px;align-items:center;border:1px solid var(--line);border-radius:calc(var(--r)/2);padding:12px 14px;cursor:pointer}
.pkg input{width:auto}.pkg span{display:grid;color:var(--ink)}.pkg small{color:var(--muted);font-weight:400}
.ok{display:none;background:color-mix(in srgb,var(--accent) 30%,var(--card));color:var(--ink);padding:12px 14px;border-radius:calc(var(--r)/2);font-size:14px}
form.req .btn{width:100%}
@media (max-width:860px){.req-g{grid-template-columns:1fr}}
@media (max-width:480px){.row2{grid-template-columns:1fr}}

/* reviews */
.rev{display:grid;grid-template-columns:4fr 8fr;gap:clamp(32px,6vw,96px);align-items:start}
.score b{display:block;font-family:var(--display);font-variation-settings:var(--dvar);font-weight:var(--dwt);letter-spacing:var(--track);font-size:clamp(96px,13vw,200px);line-height:.85}
.score .st{color:#f5a400;font-size:22px;letter-spacing:3px;margin:16px 0 6px}
[data-theme=field] .score .st{color:var(--hl)}
.score p{color:var(--muted)}
.qs{position:relative;min-height:clamp(240px,24vw,320px)}
.q{position:absolute;left:0;right:0;top:0;opacity:0;transform:translateY(16px);transition:opacity .7s var(--ease),transform .9s var(--ease);pointer-events:none}
.q.on{opacity:1;transform:none;pointer-events:auto}
.q blockquote{font-family:var(--display);font-variation-settings:var(--dvar);font-weight:var(--dwt);letter-spacing:-.02em;font-size:clamp(30px,3.6vw,56px);line-height:1.1}
[data-theme=dent] .q blockquote{font-weight:300}
.q blockquote::before{content:"“";display:block;font-size:2.2em;line-height:.6;color:var(--hl);margin-bottom:.15em}
.q cite{display:block;margin-top:26px;font-style:normal;color:var(--muted);font-size:15px}
.q cite b{color:var(--ink);font-weight:600}
.dots{display:flex;gap:8px;margin-top:22px}
.dots button{width:34px;height:4px;border-radius:4px;border:0;background:var(--line);cursor:pointer;position:relative;overflow:hidden}
.dots button.on::after{content:"";position:absolute;inset:0;background:var(--hl);transform-origin:0;animation:dfill 6.5s linear forwards}
@keyframes dfill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (max-width:860px){.rev{grid-template-columns:1fr}.qs{min-height:300px}}

.towns li:hover{color:var(--hl);padding-left:14px}
.hours{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:clamp(22px,3vw,36px);position:sticky;top:100px}
.hours h3{font-family:var(--display);font-variation-settings:var(--dvar);font-weight:var(--dwt);font-size:30px;letter-spacing:-.02em;margin-bottom:16px}
.hr{display:flex;justify-content:space-between;gap:16px;padding:13px 0;border-bottom:1px dashed var(--line);font-size:16px}
.hr b{font-weight:600;text-align:right}
.addr{margin-top:20px;color:var(--muted);font-size:15px}
.addr a{color:var(--ink);border-bottom:1px solid var(--line)}

.intro{position:fixed;inset:0;z-index:200;background:var(--deep);color:var(--on-deep);display:grid;place-items:center;padding:24px;animation:introUp 1s var(--ease) .8s forwards;pointer-events:none}

.intro::after{content:"";position:absolute;left:0;bottom:0;height:4px;width:100%;background:var(--on-deep);opacity:.85;transform-origin:0 50%;transform:scaleX(0);animation:bar .8s var(--ease) forwards}
@keyframes introUp{to{transform:translateY(-101%)}}
@keyframes bar{to{transform:scaleX(1)}}
.seen .intro{display:none}
.seen .w>span{animation-delay:calc(.15s + var(--i)*.06s)}
.seen .fade-in{animation-delay:.55s}
.status{display:inline-flex;align-items:center;gap:9px;padding:8px 13px;border-radius:999px;font-size:13px;font-weight:600;background:rgba(255,255,255,.14);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.22);color:#fff;white-space:nowrap}

.hc-badge{align-items:flex-end}

.hours .status{background:var(--bg);color:var(--ink);border-color:var(--line);backdrop-filter:none;-webkit-backdrop-filter:none}
.q cite{display:flex;align-items:center;gap:14px}
.av{flex:0 0 auto;width:46px;height:46px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font:700 18px var(--body)}

:focus-visible{outline:3px solid var(--hl);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.intro{display:none}img.lz{opacity:1}}

/* scroll reveals */
.rv{opacity:0;transform:translateY(40px);transition:opacity 1s var(--ease),transform 1.1s var(--ease);transition-delay:var(--d,0s)}

.rvi.in{clip-path:inset(0 0 0 0 round var(--r))}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .w>span{transform:none}.fade-in{opacity:1}.rv{opacity:1;transform:none}.rvi{clip-path:none}.stmt .sw{opacity:1}
}

/* live open/closed status from the listed hours (Los Angeles time) */
function openStatus(){
  if(!hours.length) return null;
  const DN=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  const dayIdx=x=>DN.indexOf(x.trim().slice(0,3));
  const daysOf=spec=>{ if(/every day/i.test(spec)) return [0,1,2,3,4,5,6]; const m=spec.split(/[–-]/); if(m.length===2){ const a=dayIdx(m[0]), b=dayIdx(m[1]); if(a<0||b<0) return []; const out=[]; for(let d=a;;d=(d+1)%7){ out.push(d); if(d===b) break; } return out; } const i=dayIdx(spec); return i<0?[]:[i]; };
  const tm=x=>{ const m=String(x||"").trim().match(/(\d{1,2})(?::(\d{2}))?\s*(AM|PM)/i); if(!m) return null; let h=+m[1]%12; if(/pm/i.test(m[3])) h+=12; return h*60+(+m[2]||0); };
  const sched={};
  hours.forEach(([spec,t])=>daysOf(spec).forEach(d=>{ if(/24 hours/i.test(t)) sched[d]="all"; else if(/closed/i.test(t)) sched[d]=null; else { const [a,b]=t.split(/[–-]/); const o=tm(a), c=tm(b); if(o!=null&&c!=null) sched[d]=[o,c]; } }));
  const now=new Date(new Date().toLocaleString("en-US",{timeZone:"America/Los_Angeles"}));
  const d=now.getDay(), m=now.getHours()*60+now.getMinutes();
  const fmt=x=>{ const h=Math.floor(x/60), mm=x%60; return (h%12||12)+(mm?":"+String(mm).padStart(2,"0"):"")+(h>=12?" PM":" AM"); };
  const today=sched[d];
  if(today==="all") return {open:true,text:"Open now, 24 hours"};
  if(today && m>=today[0] && m<today[1]) return {open:true,text:`Open now until ${fmt(today[1])}`};
  for(let k=0;k<8;k++){ const dd=(d+k)%7, x=sched[dd]; if(!x) continue;
    const when = k===0 ? "" : k===1 ? "tomorrow " : DN[dd]+" ";
    if(x==="all"){ if(k>0) return {open:false,text:`Closed now, opens ${when.trim()}`}; continue; }
    if(k===0 && m<x[0]) return {open:false,text:`Closed now, opens ${fmt(x[0])}`};
    if(k>0) return {open:false,text:`Closed now, opens ${when}${fmt(x[0])}`}; }
  return null;
}

// services: swap photo on hover / as rows pass the middle
const rows=$$(".row"), sp=$$(".svc-photo img");
function act(k){ rows.forEach(r=>r.classList.toggle("act", r.dataset.k==k)); sp.forEach((im,i)=>im.classList.toggle("on", i==k)); }
rows.forEach(r=>r.addEventListener("mouseenter",()=>act(r.dataset.k)));
const rio=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting) act(e.target.dataset.k); }),{rootMargin:"-45% 0px -45% 0px"});
rows.forEach(r=>rio.observe(r));

// gallery: arrows, drag, lightbox
const gal=$("#gal");
if(gal){
  $$("[data-g]").forEach(b=>b.addEventListener("click",()=>gal.scrollBy({left:(+b.dataset.g)*gal.clientWidth*.7,behavior:"smooth"})));
  let down=false,sx=0,sl=0,moved=false;
  gal.addEventListener("pointerdown",e=>{ if(e.pointerType!=="mouse") return; down=true;moved=false;sx=e.clientX;sl=gal.scrollLeft;gal.style.scrollSnapType="none";gal.style.cursor="grabbing"; });
  addEventListener("pointermove",e=>{ if(!down) return; const dx=e.clientX-sx; if(Math.abs(dx)>4) moved=true; gal.scrollLeft=sl-dx; });
  addEventListener("pointerup",()=>{ if(!down) return; down=false; gal.style.scrollSnapType=""; gal.style.cursor=""; });
  const lb=$("#lb"), lbi=lb.querySelector("img"); let cur=0;
  const show=i=>{ cur=(i+pics.length)%pics.length; lbi.src=img(pics[cur],2000); lb.classList.add("open"); };
  gal.addEventListener("click",e=>{ const f=e.target.closest("figure"); if(f && !moved) show(+f.dataset.i); });
  lb.querySelector(".x").onclick=()=>lb.classList.remove("open");
  lb.querySelector(".pr").onclick=e=>{e.stopPropagation();show(cur-1)};
  lb.querySelector(".nx").onclick=e=>{e.stopPropagation();show(cur+1)};
  lb.addEventListener("click",e=>{ if(e.target===lb) lb.classList.remove("open"); });
  addEventListener("keydown",e=>{ if(!lb.classList.contains("open")) return; if(e.key==="Escape") lb.classList.remove("open"); if(e.key==="ArrowRight") show(cur+1); if(e.key==="ArrowLeft") show(cur-1); });
}

// reviews rotator
const qs=$$(".q"), dots=$$("#dots button"); let qi=0, qt;
function q(i){ qi=(i+qs.length)%qs.length; qs.forEach((x,j)=>x.classList.toggle("on",j===qi)); dots.forEach((d,j)=>{ d.classList.remove("on"); if(j===qi){ void d.offsetWidth; d.classList.add("on"); } }); clearTimeout(qt); if(qs.length>1 && !reduce) qt=setTimeout(()=>q(qi+1),6500); }
dots.forEach((d,j)=>d.addEventListener("click",()=>q(j)));
if(qs.length){ const tallest=Math.max(...qs.map(x=>x.offsetHeight)); $("#qs").style.minHeight=tallest+"px"; q(0); }
addEventListener("resize",()=>{ if(qs.length){ $("#qs").style.minHeight="0px"; $("#qs").style.minHeight=Math.max(...qs.map(x=>x.offsetHeight))+"px"; } });
</script>
</body>
</html>
